name: Test CI

on:
    pull_request:
    push:
      branches: [ dev ]
    workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v7
    - name: Initialize Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - name: Node Dependencies
      run: |
        npm install --no-package-lock
    - name: Test
      run: |
        npm test
